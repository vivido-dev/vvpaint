[package]
name = "vvpaint"
version = "0.1.2"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "A lightweight Vivid 1.5 paint and annotation producer"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
image = "0.25"
tempfile = "3"
vivid_protocol = { version = "1.5", path = "../vivid_protocol" }
vivid_sdk = { version = "1.5", path = "../vivid_sdk" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
vivid_sdk = { version = "1.5", path = "../vivid_sdk", features = ["testing"] }
